 vop_ai_fixed.0.title:0 "人口思潮预设"
 vop_ai_fixed.0.desc:0 "基础运行环境对人口是否可以拥有思潮倾向及加入派系做了三档可选调整，请点击下方按钮循环切换预设：\n\n• §G仅玩家开启人口思潮（推荐默认）§!：玩家完整保留派系、狂热派系、4.6 意识形态与绝对思潮，同时关闭 AI 人口思潮与派系，保留 90% 以上后期性能优化，且玩家仍可通过文化特使与疆域向 AI 传播意识形态；\n• §Y全银河开启人口思潮§!：完整原版体验（含普通 AI 自主形成狂热派系），后期性能波动较大；\n• §R全银河关闭人口思潮§!：极限后期性能，但会禁用普通帝国派系与依赖狂热派系的 4.6 意识形态机制。\n\n该设置选项仅在开局出现一次。"
 vop_ai_fixed.0.p:0 "当前：仅玩家开启人口思潮（推荐）"
 vop_ai_fixed.0.a:0 "当前：已关闭全银河人口思潮"
 vop_ai_fixed.0.b:0 "当前：已开启全银河人口思潮"
 vop_ai_fixed.c: "完成设置"
